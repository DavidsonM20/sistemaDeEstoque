<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <link rel="stylesheet" href="../CSS/reset.css" />
        <link rel="stylesheet" href="../CSS/color.css" />
        <link rel="stylesheet" href="../CSS/CadastroProdutos.css" />
        <title>Cadastro Produto</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header id="header">
            <h1 id="tituloCadastro">Sistema de Estoque</h1>
            <nav id="menu">
                <ul class="menu-lista">
                    <li><a href="dashboard.html">Início</a></li>
                    <li><a href="dashboard.html">Gerenciamento</a></li>
                    <li><a href="cadastro.html" class="btn-menu">Cadastro</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="form-container">
                <form action="../cadastroProdutos" method="POST" id="formCadastro">

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="codigoBarras">Código de Barras</label>
                            <input type="text" name="codigoBarras" id="codigoBarras" required />
                        </div>
                    </div>

                    <div class="grupo-form">
                        <label for="nomeProduto">Nome do Produto</label>
                        <input type="text" name="nomeProduto" id="nomeProduto" required />
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="fabricante">Fabricante</label>
                            <input type="text" name="fabricante" id="fabricante" required />
                        </div>

                        <div class="grupo-form">
                            <label for="marca">Marca</label>
                            <input type="text" name="marca" id="marca" required />
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="dataFabricacao">Data de Fabricação</label>
                            <input type="date" name="dataFabricacao" id="dataFabricacao" required />
                        </div>

                        <div class="grupo-form">
                            <label for="dataVencimento">Data de Vencimento</label>
                            <input type="date" name="dataVencimento" id="dataVencimento" required />
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="quantidade">Quantidade</label>
                            <input type="number" name="quantidade" id="quantidade" required />
                        </div>

                        <div class="grupo-form">
                            <label for="valor">Valor Unitário</label>
                            <input type="number" step="0.01" name="valor" id="valor" required />
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="total">Total</label>
                            <input type="number" step="0.01" name="total" id="total" readonly />
                        </div>

                        <div class="grupo-form">
                            <label for="status">Status</label>
                            <select name="status" id="status" required>
                                <option value="">Selecione...</option>
                                <option value="entrada">Entrada</option>
                                <option value="saida">Saída</option>
                            </select>
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="prateleira">Prateleira / Local de Armazenamento</label>
                            <input type="text" name="prateleira" id="prateleira" placeholder="Ex: A1, Corredor 3, Depósito B" required />
                        </div>

                        <div class="grupo-form">
                            <label for="estoqueMinimo">Estoque Mínimo</label>
                            <input type="number" name="estoqueMinimo" id="estoqueMinimo" placeholder="Ex: 5" min="0" value="5" required />
                        </div>
                    </div>

                    <div class="acoes-form">
                        <button type="submit" class="btn-salvar">Salvar Produto</button>
                        <a href="dashboard.html" class="btn-cancelar">Cancelar</a>
                    </div>
                </form>
            </section>
        </main>

        <script src="../js/CadastroProdutos.js"></script>
    </body>
</html>
